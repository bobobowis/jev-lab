name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.18", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - run: npm run demo
      - name: one level through npm (PowerShell on Windows, bash elsewhere)
        run: npm run level -- 1 a
      - name: jev mcp answers a handshake over stdio
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node packages/jev-kit/dist/cli/index.js mcp --level 8 --mock > mcp.out
          grep -q '"name":"jev"' mcp.out
          grep -q 'ask_jev_file_bool' mcp.out
      - name: jev hook answers a captured Claude Code payload
        shell: bash
        run: |
          head -n 1 packages/jev-kit/tests/fixtures/claude/hooks.jsonl > /dev/null
          echo '{"session_id":"ci","cwd":".","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"ls"}}' \
            | JEV_EVENT_DIR=ci-events node packages/jev-kit/dist/cli/index.js hook --harness claude --event PreToolUse --mock
          test "$?" = 0
          ls ci-events/claude-*.jsonl
      - name: the packed package installs and runs in an empty project
        shell: bash
        run: |
          cd packages/jev-kit && npm pack --pack-destination "$RUNNER_TEMP" && cd -
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/bobobowis-jev-kit-*.tgz
          npx jev --help
          set +e; npx jev gate "Is this a test?" --state "yes, a CI smoke test" --mock; code=$?; set -e
          test "$code" = 0 -o "$code" = 1
